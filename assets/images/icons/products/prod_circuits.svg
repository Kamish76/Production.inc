<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#040D07" flood-opacity="0.55"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
    </filter>
    <linearGradient id="pcbTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="35%" stop-color="#00C853"/>
      <stop offset="70%" stop-color="#00A844"/>
      <stop offset="100%" stop-color="#007E33"/>
    </linearGradient>
    <linearGradient id="pcbSideLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007E33"/>
      <stop offset="100%" stop-color="#004D20"/>
    </linearGradient>
    <linearGradient id="pcbSideRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005A24"/>
      <stop offset="100%" stop-color="#003314"/>
    </linearGradient>
    <linearGradient id="goldTrace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="75%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="chipTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="60%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#1A2024"/>
    </linearGradient>
    <linearGradient id="chipSideLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21272B"/>
      <stop offset="100%" stop-color="#14181B"/>
    </linearGradient>
    <linearGradient id="chipSideRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D20"/>
      <stop offset="100%" stop-color="#0D1012"/>
    </linearGradient>
    <linearGradient id="silverPin" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CFD8DC"/>
      <stop offset="100%" stop-color="#90A4AE"/>
    </linearGradient>
  </defs>
