    <line x1="131.3" y1="126.1" x2="136.3" y2="123.2" stroke="url(#silverPin)" stroke-width="2" stroke-linecap="round"/>
    <line x1="136.2" y1="123.3" x2="141.2" y2="120.4" stroke="url(#silverPin)" stroke-width="2" stroke-linecap="round"/>
