    <polygon points="128,128 152.2,114 152.2,120 128,134" fill="url(#chipSideRight)" stroke="#0D1012" stroke-width="0.8"/>
    <polygon points="128,100 152.2,114 128,128 103.8,114" fill="url(#chipTop)" stroke="#455A64" stroke-width="1.2"/>
    <polyline points="103.8,114 128,100 152.2,114" fill="none" stroke="#78909C" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="112" cy="114" r="2.2" fill="#14181B" stroke="#455A64" stroke-width="0.6"/>
