<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients for Industrial Machine Body -->
    <linearGradient id="retailChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37474F"/>
      <stop offset="50%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#1A2327"/>
    </linearGradient>
    <linearGradient id="chassisBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#607D8B"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="canopyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#1DE9B6"/>
    </linearGradient>
    <linearGradient id="conveyorBelt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="50%" stop-color="#424242"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <linearGradient id="retailBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="retailRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>
    <linearGradient id="armMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="50%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#78909C"/>
    </linearGradient>
    <linearGradient id="neonLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="screenGaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
  </defs>

  <!-- Base Ambient Shadow -->
  <ellipse cx="256" cy="450" rx="190" ry="32" fill="#0C1014" opacity="0.6"/>

  <!-- Machine Platform Base -->
  <rect x="76" y="380" width="360" height="44" rx="14" fill="url(#retailChassis)" stroke="#455A64" stroke-width="3"/>
  <rect x="88" y="388" width="336" height="8" rx="4" fill="#1C252B"/>
  
  <!-- Indicator Base Feet -->
  <rect x="100" y="424" width="48" height="12" rx="4" fill="#263238"/>
  <rect x="364" y="424" width="48" height="12" rx="4" fill="#263238"/>

  <!-- Lower Conveyor Mechanism -->
  <rect x="96" y="320" width="320" height="60" rx="10" fill="url(#conveyorBelt)" stroke="#37474F" stroke-width="2"/>
  <!-- Conveyor Tread Lines -->
  <line x1="130" y1="324" x2="130" y2="376" stroke="#616161" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="324" x2="170" y2="376" stroke="#616161" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="324" x2="210" y2="376" stroke="#616161" stroke-width="3" stroke-linecap="round"/>
  <line x1="250" y1="324" x2="250" y2="376" stroke="#616161" stroke-width="3" stroke-linecap="round"/>
  <line x1="290" y1="324" x2="290" y2="376" stroke="#616161" stroke-width="3" stroke-linecap="round"/>
  <line x1="330" y1="324" x2="330" y2="376" stroke="#616161" stroke-width="3" stroke-linecap="round"/>
  <line x1="370" y1="324" x2="370" y2="376" stroke="#616161" stroke-width="3" stroke-linecap="round"/>

  <!-- Conveyor Side Rollers -->
  <circle cx="106" cy="350" r="14" fill="#757575"/>
  <circle cx="106" cy="350" r="6" fill="#BDBDBD"/>
  <circle cx="406" cy="350" r="14" fill="#757575"/>
  <circle cx="406" cy="350" r="6" fill="#BDBDBD"/>

  <!-- Left Main Support Pillar -->
  <rect x="96" y="160" width="36" height="160" rx="8" fill="url(#chassisBevel)"/>
  <rect x="102" y="170" width="24" height="140" rx="4" fill="#1C252B"/>
  <line x1="114" y1="180" x2="114" y2="300" stroke="#00E676" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Main Support Pillar -->
  <rect x="380" y="160" width="36" height="160" rx="8" fill="url(#chassisBevel)"/>
  <rect x="386" y="170" width="24" height="140" rx="4" fill="#1C252B"/>
  <line x1="398" y1="180" x2="398" y2="300" stroke="#00E676" stroke-width="2" stroke-linecap="round"/>

  <!-- Upper Gantry Housing / Overhead Canopy Structure -->
  <path d="M 80 160 L 130 110 L 382 110 L 432 160 Z" fill="url(#retailChassis)" stroke="#455A64" stroke-width="3"/>
  
  <!-- Neon Storefront Canopy Stripes (Retail Theme) -->
  <path d="M 120 160 L 146 114 L 176 114 L 150 160 Z" fill="url(#canopyGradient)" opacity="0.9"/>
  <path d="M 210 160 L 236 114 L 266 114 L 240 160 Z" fill="url(#canopyGradient)" opacity="0.9"/>
  <path d="M 300 160 L 326 114 L 356 114 L 330 160 Z" fill="url(#canopyGradient)" opacity="0.9"/>

  <!-- Top Display & Telemetry Screen -->
  <rect x="176" y="68" width="160" height="42" rx="8" fill="#1A2327" stroke="#37474F" stroke-width="2"/>
  <rect x="182" y="74" width="148" height="30" rx="5" fill="url(#screenGaze)"/>
  <!-- Status Graph / Barcode Hologram on Screen -->
  <line x1="192" y1="89" x2="204" y2="89" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="210" y1="83" x2="222" y2="83" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="228" y1="92" x2="242" y2="92" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="248" y1="85" x2="262" y2="85" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="280" cy="89" r="4" fill="#00E676"/>
  <circle cx="295" cy="89" r="4" fill="#FFD54F"/>
  <circle cx="310" cy="89" r="4" fill="#FF5252"/>

  <!-- Robotic Packaging Manipulator Arm (Left) -->
  <g transform="translate(140, 160)">
    <circle cx="0" cy="0" r="16" fill="url(#armMetal)" stroke="#37474F" stroke-width="2"/>
    <rect x="-8" y="0" width="16" height="58" rx="6" fill="url(#armMetal)" transform="rotate(25)"/>
    <circle cx="24" cy="52" r="12" fill="url(#armMetal)"/>
    <rect x="18" y="52" width="12" height="50" rx="5" fill="url(#armMetal)" transform="rotate(-30 24 52)"/>
    <!-- Precision Gripper -->
    <path d="M 46 95 L 40 115 L 50 118" fill="none" stroke="#ECEFF1" stroke-width="4" stroke-linecap="round"/>
    <path d="M 54 92 L 64 112 L 56 116" fill="none" stroke="#ECEFF1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Robotic Assembly Arm (Right) -->
  <g transform="translate(372, 160)">
    <circle cx="0" cy="0" r="16" fill="url(#armMetal)" stroke="#37474F" stroke-width="2"/>
    <rect x="-8" y="0" width="16" height="58" rx="6" fill="url(#armMetal)" transform="rotate(-25)"/>
    <circle cx="-24" cy="52" r="12" fill="url(#armMetal)"/>
    <rect x="-30" y="52" width="12" height="50" rx="5" fill="url(#armMetal)" transform="rotate(30 -24 52)"/>
    <!-- Precision Laser Welder / Gripper -->
    <path d="M -46 95 L -40 115 L -50 118" fill="none" stroke="#ECEFF1" stroke-width="4" stroke-linecap="round"/>
    <path d="M -54 92 L -64 112 L -56 116" fill="none" stroke="#ECEFF1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Laser Barcode Scanner Cone Beam -->
  <polygon points="256,155 200,320 312,320" fill="url(#neonLaser)"/>

  <!-- Scanner Head Unit -->
  <rect x="236" y="150" width="40" height="20" rx="6" fill="#37474F" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="256" cy="160" r="5" fill="#00E5FF"/>

  <!-- Packaged Retail Finished Good (Center on Conveyor) -->
  <g transform="translate(206, 255)">
    <!-- Base Box (Isometric angled retail carton) -->
    <rect x="0" y="0" width="100" height="85" rx="10" fill="url(#retailBox)" stroke="#FFA000" stroke-width="2"/>
    <!-- Retail Box Lid Shading -->
    <path d="M 0 0 L 10 0 L 90 0 L 100 0 L 90 20 L 10 20 Z" fill="#FFE082" opacity="0.6"/>
    <!-- Luxury Ribbon Cross -->
    <rect x="42" y="0" width="16" height="85" fill="url(#retailRibbon)"/>
    <rect x="0" y="34" width="100" height="16" fill="url(#retailRibbon)"/>
    <!-- Ribbon Bow Knot -->
    <circle cx="50" cy="42" r="11" fill="#FF1744"/>
    <ellipse cx="38" cy="38" rx="8" ry="5" fill="#FF5252" transform="rotate(-25 38 38)"/>
    <ellipse cx="62" cy="38" rx="8" ry="5" fill="#FF5252" transform="rotate(25 62 38)"/>
    <!-- Barcode Stamp Tag on Box -->
    <rect x="66" y="55" width="26" height="20" rx="2" fill="#FFFFFF"/>
    <line x1="70" y1="58" x2="70" y2="72" stroke="#212121" stroke-width="1.5"/>
    <line x1="74" y1="58" x2="74" y2="72" stroke="#212121" stroke-width="2"/>
    <line x1="79" y1="58" x2="79" y2="72" stroke="#212121" stroke-width="1.2"/>
    <line x1="84" y1="58" x2="84" y2="72" stroke="#212121" stroke-width="2"/>
    <line x1="89" y1="58" x2="89" y2="72" stroke="#212121" stroke-width="1.5"/>
  </g>

  <!-- Finished Retail Item 2 (Exiting Conveyor Right) -->
  <g transform="translate(325, 275) scale(0.65)" opacity="0.95">
    <rect x="0" y="0" width="100" height="85" rx="10" fill="url(#retailBox)" stroke="#FFA000" stroke-width="2"/>
    <rect x="42" y="0" width="16" height="85" fill="url(#retailRibbon)"/>
    <rect x="0" y="34" width="100" height="16" fill="url(#retailRibbon)"/>
  </g>

  <!-- Incoming Assembled Good 3 (Entering Conveyor Left) -->
  <g transform="translate(120, 275) scale(0.65)" opacity="0.85">
    <rect x="0" y="0" width="100" height="85" rx="10" fill="url(#retailBox)" stroke="#FFA000" stroke-width="2"/>
    <rect x="42" y="0" width="16" height="85" fill="url(#retailRibbon)"/>
    <rect x="0" y="34" width="100" height="16" fill="url(#retailRibbon)"/>
  </g>

  <!-- Ambient Floor Glow -->
  <ellipse cx="256" cy="405" rx="90" ry="8" fill="#00E5FF" opacity="0.35"/>
</svg>
