<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#1A1208" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="kraftTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BE84"/>
      <stop offset="50%" stop-color="#D7A86E"/>
      <stop offset="100%" stop-color="#C49A45"/>
    </linearGradient>
    <linearGradient id="kraftSideLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C49A45"/>
      <stop offset="100%" stop-color="#9C722B"/>
    </linearGradient>
    <linearGradient id="kraftSideRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A57C32"/>
      <stop offset="100%" stop-color="#7B5518"/>
    </linearGradient>
    <linearGradient id="rollBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0B67C"/>
      <stop offset="40%" stop-color="#D7A86E"/>
      <stop offset="80%" stop-color="#B88A39"/>
      <stop offset="100%" stop-color="#8D631E"/>
    </linearGradient>
    <linearGradient id="rollEnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C49A45"/>
      <stop offset="100%" stop-color="#7B5518"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="205" rx="90" ry="24" fill="#140E06" opacity="0.4" filter="blur(7px)"/>
  <g filter="url(#shadow)">
    <!-- Stack of 3 Cardboard Sheets -->
    <!-- Sheet 1 (Bottom) -->
    <g transform="translate(42, 60)">
      <polygon points="45,70 115,108 115,116 45,78" fill="url(#kraftSideLeft)"/>
      <polygon points="115,108 185,70 185,78 115,116" fill="url(#kraftSideRight)"/>
      <polygon points="115,32 185,70 115,108 45,70" fill="url(#kraftTop)" stroke="#B88A39" stroke-width="0.8"/>
      <!-- Fluted edge ridges on right side -->
      <line x1="120" y1="113" x2="120" y2="115.5" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="130" y1="107.5" x2="130" y2="110" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="140" y1="102" x2="140" y2="104.5" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="150" y1="96.5" x2="150" y2="99" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="160" y1="91" x2="160" y2="93.5" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="170" y1="85.5" x2="170" y2="88" stroke="#7B5518" stroke-width="1.5"/>
    </g>
    <!-- Sheet 2 (Middle) -->
    <g transform="translate(42, 46)">
      <polygon points="45,70 115,108 115,116 45,78" fill="url(#kraftSideLeft)"/>
      <polygon points="115,108 185,70 185,78 115,116" fill="url(#kraftSideRight)"/>
      <polygon points="115,32 185,70 115,108 45,70" fill="url(#kraftTop)" stroke="#B88A39" stroke-width="0.8"/>
      <!-- Fluted edge ridges -->
      <line x1="120" y1="113" x2="120" y2="115.5" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="130" y1="107.5" x2="130" y2="110" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="140" y1="102" x2="140" y2="104.5" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="150" y1="96.5" x2="150" y2="99" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="160" y1="91" x2="160" y2="93.5" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="170" y1="85.5" x2="170" y2="88" stroke="#7B5518" stroke-width="1.5"/>
    </g>
    <!-- Sheet 3 (Top) -->
    <g transform="translate(42, 32)">
      <polygon points="45,70 115,108 115,116 45,78" fill="url(#kraftSideLeft)"/>
      <polygon points="115,108 185,70 185,78 115,116" fill="url(#kraftSideRight)"/>
      <polygon points="115,32 185,70 115,108 45,70" fill="url(#kraftTop)" stroke="#B88A39" stroke-width="0.8"/>
      <!-- Highlight edge -->
      <polyline points="45,70 115,32 185,70" fill="none" stroke="#FFF3D6" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <!-- Fluted edge ridges -->
      <line x1="120" y1="113" x2="120" y2="115.5" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="130" y1="107.5" x2="130" y2="110" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="140" y1="102" x2="140" y2="104.5" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="150" y1="96.5" x2="150" y2="99" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="160" y1="91" x2="160" y2="93.5" stroke="#7B5518" stroke-width="1.5"/>
      <line x1="170" y1="85.5" x2="170" y2="88" stroke="#7B5518" stroke-width="1.5"/>
    </g>
    <!-- Kraft Paper Roll leaning on stack -->
    <g transform="translate(68, 118)">
      <!-- Roll cylinder body -->
      <path d="M 12 18 L 82 56 L 82 78 L 12 40 Z" fill="url(#rollBody)"/>
      <line x1="12" y1="18" x2="82" y2="56" stroke="#FFE0B2" stroke-width="1.5" opacity="0.75"/>
      <!-- Roll End Face (Isometric Ellipse) -->
      <ellipse cx="12" cy="29" rx="14" ry="20" transform="rotate(-30, 12, 29)" fill="url(#rollEnd)" stroke="#5D4037" stroke-width="1.5"/>
      <!-- Inner core hole -->
      <ellipse cx="12" cy="29" rx="5" ry="7" transform="rotate(-30, 12, 29)" fill="#3E2723"/>
      <!-- Front Rim Face -->
      <ellipse cx="82" cy="67" rx="14" ry="20" transform="rotate(-30, 82, 67)" fill="url(#rollEnd)" stroke="#8D6E63" stroke-width="1.2"/>
      <ellipse cx="82" cy="67" rx="5" ry="7" transform="rotate(-30, 82, 67)" fill="#2E1C14"/>
    </g>
  </g>
</svg>