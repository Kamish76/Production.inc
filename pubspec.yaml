name: game1
description: "An Android game built with Flutter."
publish_to: 'none'

version: 1.4.9+9

environment:
  sdk: '^3.7.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.1
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.6
  collection: ^1.18.0
  android_intent_plus: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/AppIcon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/images/AppIcon.png"
  web:
    generate: true
    image_path: "assets/images/AppIcon.png"
    background_color: "#2196F3"
    theme_color: "#2196F3"
