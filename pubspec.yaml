name: game1
description: "An Android game built with Flutter."
publish_to: "none"

version: 1.4.14+14

environment:
  sdk: "^3.7.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^16.3.0
  shared_preferences: ^2.5.4
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.6
  collection: ^1.18.0
  android_intent_plus: ^6.0.0
  logger: ^2.6.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/AppIcon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/images/AppIcon.png"
  web:
    generate: true
    image_path: "assets/images/AppIcon.png"
    background_color: "#2196F3"
    theme_color: "#2196F3"
